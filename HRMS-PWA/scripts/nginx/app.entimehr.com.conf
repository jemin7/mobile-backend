##################################################
# HTTP SERVER - Redirect HTTP to HTTPS
##################################################

server {
    listen 80;
    listen [::]:80;

    server_name app.entimehr.com;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

##################################################
# HTTPS SERVER
##################################################

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name app.entimehr.com;

    ##################################################
    # SSL
    ##################################################

    ssl_certificate /etc/ssl/cloudflare/app.entimehr.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/app.entimehr.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:20m;
    ssl_prefer_server_ciphers off;

    ##################################################
    # SECURITY HEADERS
    ##################################################

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    ##################################################
    # LOGS
    ##################################################

    access_log /var/log/nginx/openhrm_access.log;
    error_log /var/log/nginx/openhrm_error.log;

    ##################################################
    # GENERAL SETTINGS
    ##################################################

    client_max_body_size 100M;

    ##################################################
    # BLOCK HIDDEN FILES
    ##################################################

    location ~ /\. {
        deny all;
    }

    ##################################################
    # NEXTJS STATIC FILES — Client A (OpenHRM)
    ##################################################

    location ^~ /_next/ {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 1y;
        access_log off;
    }

    ##################################################
    # STATIC FILE CACHE — Client A (OpenHRM)
    ##################################################

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|css|js)$ {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 7d;
        access_log off;
    }

    ##################################################
    # BACKEND API - NestJS (port 8001) — Client A (OpenHRM)
    ##################################################

    location /backend/ {
        proxy_pass http://127.0.0.1:8001/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    ##################################################
    # FRONTEND - NextJS (port 3000) — Client A (OpenHRM)
    ##################################################

    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
